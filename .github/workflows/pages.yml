# ЗЕРКАЛО НА GITHUB PAGES — ВЫКЛЮЧЕНО (06.08.2026)
#
# Витрина переехала на Vercel: там она собирается вместе с MCP-сервером на один
# домен (solid-dumb-kit.vercel.app) и попадает в прод за ~16 секунд после пуша.
# У Pages при сборке в те же 16 секунд шаг deploy стабильно тянулся 6–10 минут,
# и держать два деплоя на каждый пуш ради второго адреса незачем.
#
# Файл оставлен целиком, а не удалён: понадобится запасная площадка (Vercel
# прилёг, кончился лимит, нужен адрес на github.io) — раскомментируй тело ниже
# и верни в playground/vite.config.ts базу '/solid-dumb-kit/' (сейчас она
# выбирается по переменной VERCEL, так что Pages соберётся и без правок).
#
# Тело закомментировано, а не переведено на workflow_dispatch, потому что так
# видно: зеркало не «иногда вручную», а выключено совсем.

